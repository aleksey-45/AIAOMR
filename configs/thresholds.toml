# 验收阈值（规格 §9.2 语料门、§11 通过标准；计划任务 14、15）。
#
# 任务 14 的 eval/score.py 从这里读阈值，代码里不许内联阈值（EV-01）。
# 只登记规格与计划里明确给出数字/取值的项：没有给出数字的指标不在这里凭空填值，
# 等规格给数再补（改阈值必须单独提交并写明理由，§6.2 第 10 条）。

[corpus_gate]
# 弦号加品数一致率，下限。指标名取 §9.2 的 string_fret；
# 数字取计划任务 15 的通过标准"弦号加品数一致率不低于 0.90"。
string_fret = 0.90

# 小节时值自洽率，下限。指标名取 §9.2 的 bars_add_up；
# 数字取计划任务 15 的通过标准"小节时值自洽率不低于 0.95"。
bars_add_up = 0.95

# 报警解决率，下限。§2.6 AD-05 明确要求 1.00：任何报警不得停留在未记录状态。
alarm_resolved = 1.00

# §9.2 其余指标（rest_pattern / pitch_exact / system_recall / json_valid /
# structure_change_recall）规格没有给出数字，这里不凭空填值；等规格定数再补
# （改阈值必须单独提交并写明理由，§6.2 第 10 条）。

[audit]
# §4.4、§11：审计两项都为 0 才算通过，任一非零即 E_AUDIT。
pitch_mismatch = 0
bar_errors = 0

[build]
# §4.3、§11：写出后重新解析并逐音符比对，必须一致（否则 E_BUILD_ROUNDTRIP）。
roundtrip_ok = true
