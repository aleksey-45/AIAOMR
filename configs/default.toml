# 与 provider 无关的参数。逐项对应规格 §5 的参数表。
#
# provider 专属参数（model、max_concurrency、retry_empty、retry_http、thinking、
# max_tokens_rule、temperature）不写在这里，写进 configs/providers/<name>.toml。
# 代码里不许出现本表之外的魔数；新增参数必须先登记到规格 §5。

[provider]
# 当前唯一实现；其余名字启动即报错（requires configs/providers/<name>.toml 存在）。
name = "deepseek_flash"

[crop]
# 裁片像素区间，单位百万像素（RD-02）。P0 实测：统一缩放到 1.6 MP 才读得全，
# 低于这个数会掉准确率，所以上下限都取 1.6（见 docs/p0-results.md）。
target_mp_min = 1.6
target_mp_max = 1.6
# 长边上限；运行时再与 caps.max_side_px 取 min（V-12、RD-09）。
# 1.6 MP 的长条约 3270 像素宽，所以不能再用 2500。
max_side_px = 4096
# 单次调用请求的小节数上限（RD-05）。
max_measures_per_call = 8
# 拆分裁片的引用条宽度区间，像素；实际宽度取 4×deg 再 clamp 到这里（RD-03、R-05）。
header_strip_px = [40, 100]

[read]
# 压缩后有效谱线间距下限，deg；低于此值只记 WARN，不阻断。
min_deg_eff = 12

[budget]
# 成本预算的唯一单位：人民币元 / 每 8 小节，谷价（空闲时段）口径，四位小数（V-09、§12）。
cny_per_8measures = 0.0150
# 记账精度。它不是账单：只用于预算闸与回归比较，不与 provider 对账。
precision = 0.0001

[locate]
# 谱线行覆盖率下限。
line_frac_min = 0.60
# 谱线厚度超过即判为黑边/进度条。
max_line_thickness_px = 25
# 五线谱带与 TAB 带的纵向间隔区间，像素（R-02）。
tab_pair_gap_px = [60, 400]

[skeleton]
# 拍号读不出时，推断"小节时值众数"所需的最少小节数（S-01）。
infer_ts_min_measures = 3
# 速度读不出时的默认值。
default_tempo = 120
# 调号读不出时的默认值；不影响音高，只影响 A2 与显示（S-03）。
default_key = "CMajor"
# 曲名读不出时用文件名 stem。
title_from_filename = true

[structure]
# A11/A12 聚类检测所需的最小连续小节数（§2.2.3）。
change_min_run = 3

[emit]
# GP5 文本编码（本机 ANSI 代码页）。
encoding = "cp936"

[adjudicate]
# 复读 + 终裁的最大轮数，防止无限循环。
max_rounds = 2

[retain]
# 是否保留裁片图（证据留存，占空间）。
crops = true

[run]
# 阻断时等待在途请求返回的宽限，毫秒（用于准确记账）。
inflight_grace_ms = 30000

[staff]
# 读五线谱层的阈值（docs/spec-staff.md §11）。长度、间距一类量的单位都是 deg
# （压缩后的有效谱线间距）；只有抹线余量是像素、附点面积下限是平方像素。
# 这些只是真图标定前的初值，改动必须写清"改了哪个值、哪张样本、前后各错几拍"。
# 判据代码里只许查这张表，不许再写模块级阈值常量（纯查表映射不算阈值）。
#
# 五线谱带上下余量（SR-10/SR-12）。
band_margin_deg = 4.0
# 小节窗口左右外扩，deg（SR-14）：只作为上下文，符号归属仍按中心落在本小节判。
measure_margin_deg = 0.5
# 抹谱线时按整条线厚再加的抗锯齿余量，像素（SR-11）。
line_erase_pad_px = 1
# 符头宽度范围，deg（SR-20）。
head_w_deg = [0.7, 1.9]
# 符头高度范围，deg（SR-20）。
head_h_deg = [0.3, 1.2]
# 符头外接框的宽高比下限（SR-20）。
head_aspect_min = 1.1
# 填充率低于此为空心；高于下面那一项为实心；落在中间 abstain（AR-02，SR-21）。
head_fill_hollow_max = 0.55
head_fill_filled_min = 0.75
# 实心符头候选：腐蚀核大小，deg。细笔画（符干/谱线/空心环）会腐蚀掉，实心符头留下核（SR-20）。
head_erode_deg = 0.33
# 空心符头：环壁（空腔四周墨迹）最大厚度，deg；超过它的空腔（横梁与谱线之间的缝）不是符头。
head_ring_max_deg = 0.55
# 空心符头：被围空腔的高度下限与宽高比上限（deg / 无量纲）。
head_cavity_min_h_deg = 0.2
head_cavity_aspect_max = 3.0
# 模板匹配（TM_CCOEFF_NORMED）采纳下限（SR-22）。
template_ncc_min = 0.75
# 模板归一化后的画布尺寸，像素（SR-22：候选按 bbox 归一化后再比形状）。
template_norm_w = 24
template_norm_h = 16
# 符干长度范围，deg（SR-25）。
stem_len_deg = [2.0, 5.5]
# 横梁段覆盖率下限（SR-28）。
beam_coverage = 0.85
# 横梁段：相邻符干的水平间距区间，deg；段端点"接到符干"的容差，deg；同一层内行分组间隔，deg。
beam_gap_deg = [0.5, 4.5]
beam_attach_tol_deg = 0.6
beam_row_gap_deg = 0.35
# 横梁段厚度范围，deg（SR-28）。
beam_thickness_deg = [0.3, 0.9]
# 横梁分层 y 差阈值，deg（SR-29）。
layer_gap_deg = 0.8
# 符尾区域：墨迹面积下限，deg²；行均值下限；行分组间隔，deg（SR-31）。
flag_min_ink_deg2 = 0.12
flag_row_mean = 0.15
flag_row_gap_deg = 0.3
# 附点面积下限，平方像素（规格 §5 写 "3–0.45·deg²" 的左端，SR-34）。
dot_min_area_px = 3.0
# 附点面积上限的 deg² 倍数，运行时上限 = dot_max_area_deg2 × deg²（SR-34）。
dot_max_area_deg2 = 0.45
# 附点锚点：离符头中心的横向距离区间，deg；纵向容差，deg（SR-33）。
dot_offset_deg = [0.6, 1.6]
dot_dy_deg = 0.6
# 双附点：第二个点相对第一个点的额外位移，deg；附点自身外接框上限，deg（SR-34）。
dot_second_gap_deg = 0.9
dot_max_side_deg = 0.5
# 多小节休止条：横向覆盖率下限（SR-39b）。
rest_bar_coverage = 0.8
# 全休止/二分休止的实心矩形宽度，deg；两种只靠挂线位置区分（SR-37）。
# 真图实测：视频截图里矩形实宽 1.15~1.29·deg，比规格初值 1.2 略窄，下限放到 1.1。
rest_rect_w_deg = [1.1, 2.0]
# 同一个实心矩形的高度范围，deg（比横梁薄、比附点厚）。
rest_rect_h_deg = [0.15, 0.65]
# 全/二分休止矩形的填充率下限；矩形贴到谱线的容差，deg（SR-37）。
rest_rect_fill_min = 0.85
rest_line_snap_deg = 0.3
# 四分/八分/十六分/三十二分休止字形的高度范围，deg（SR-38/SR-39）。
rest_glyph_h_deg = [1.0, 3.6]
# 四分休止字形的高宽比下限；钩状休止的钩凸出量（相对字形宽）（SR-38/SR-39）。
rest_quarter_aspect = 2.0
rest_hook_protrude_deg = 0.25
# 符头与符干配对的最大距离，deg（SR-40）。
pair_max_deg = 1.2
